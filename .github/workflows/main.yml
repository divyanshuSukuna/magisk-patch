name: Patch boot.img with AIK + Magisk
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Download boot.img
        run: |
          curl -L "https://github.com/divyanshuSukuna/magisk-patch/raw/refs/heads/main/boot.img?download=" -o boot.img
      - name: Download AIK-Linux-x64 (with binaries)
        run: |
          wget -q https://github.com/ndrancs/AIK-Linux-x32-x64/archive/refs/heads/master.zip -O aik.zip
          unzip -q aik.zip
          mv AIK-Linux-x32-x64-master aik
          cd aik
          chmod +x *.sh bin/*_x64 bin/magic
      - name: Unpack, Patch, Repack (all in one step)
        run: |
          set -e
          cd aik
          # Unpack
          ./unpackimg_x64.sh ../boot.img
          
          # Determine compression
          ramdiskcomp=$(cat split_img/*-ramdiskcomp)
          case $ramdiskcomp in
            gzip) compext=gz; repackcmd="gzip";;
            lzop) compext=lzo; repackcmd="lzop";;
            xz) compext=xz; repackcmd="xz -1 -Ccrc32";;
            lzma) compext=lzma; repackcmd="xz -Flzma";;
            bzip2) compext=bz2; repackcmd="bzip2";;
            lz4) compext=lz4; repackcmd="$PWD/bin/lz4_x64 -l stdin stdout";;
          esac
          
          # Repack ramdisk to cpio
          cd ramdisk
          find . | cpio -o -H newc | $repackcmd > ../ramdisk.cpio.$compext
          cd ..
          
          # Download Magisk & patch
          CANARY_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases | grep -o '"browser_download_url": "[^"]*Magisk-[^"]*\.apk"' | head -1 | cut -d'"' -f4)
          wget -q "$CANARY_URL" -O magisk.apk
          unzip -q magisk.apk lib/x86_64/libmagiskboot.so -d magisk
          chmod +x magisk/lib/x86_64/libmagiskboot.so
          magisk/lib/x86_64/libmagiskboot.so hexpatch ramdisk.cpio.$compext "skip_initramfs" "want_initram"
          
          # Put patched ramdisk back for AIK repack
          cp ramdisk.cpio.$compext "split_img/$(basename ../boot.img)-ramdisk.cpio.$compext"
          
          # Repack boot image
          ./repackimg_x64.sh
          mv image-new.img ../magisk_patched.img
      - name: Upload patched boot.img
        uses: actions/upload-artifact@v4
        with:
          name: magisk_patched.img
          path: magisk_patched.img

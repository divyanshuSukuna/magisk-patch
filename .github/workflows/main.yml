name: Patch boot.img with AIK + Magisk
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Download boot.img
        run: |
          curl -L "https://github.com/divyanshuSukuna/magisk-patch/raw/refs/heads/main/boot.img?download=" -o boot.img
      - name: Download AIK-Linux-x64 (with binaries)
        run: |
          wget -q https://github.com/ndrancs/AIK-Linux-x32-x64/archive/refs/heads/master.zip -O aik.zip
          unzip -q aik.zip
          mv AIK-Linux-x32-x64-master aik
          cd aik
          chmod +x *.sh bin/*_x64 bin/magic
      - name: Unpack, Patch, Repack (with full debug)
        run: |
          set -e
          cd aik
          echo "=== UNPACKING ==="
          ./unpackimg_x64.sh ../boot.img
          
          echo "=== CHECKING FILES ==="
          ls -la split_img/
          
          echo "=== DECOMPRESSING RAMDISK ==="
          gunzip -c split_img/*-ramdisk.cpio.gz > ramdisk.cpio
          echo "ramdisk.cpio size: $(wc -c < ramdisk.cpio)"
          
          echo "=== DOWNLOADING MAGISK ==="
          CANARY_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases | grep -o '"browser_download_url": "[^"]*Magisk-[^"]*\.apk"' | head -1 | cut -d'"' -f4)
          echo "Magisk URL: $CANARY_URL"
          wget -q "$CANARY_URL" -O magisk.apk
          unzip -q magisk.apk lib/x86_64/libmagiskboot.so -d magisk
          chmod +x magisk/lib/x86_64/libmagiskboot.so
          
          echo "=== SEARCHING FOR PATCH TARGET ==="
          strings ramdisk.cpio | grep -i "skip_initramfs" || echo "String NOT found in ramdisk"
          strings ramdisk.cpio | grep -i "initramfs" | head -5
          
          echo "=== ATTEMPTING PATCH ==="
          magisk/lib/x86_64/libmagiskboot.so hexpatch ramdisk.cpio "skip_initramfs" "want_initram" 2>&1 || {
            echo "hexpatch failed with exit code: $?"
            echo "Trying alternative pattern..."
            magisk/lib/x86_64/libmagiskboot.so hexpatch ramdisk.cpio "skip_initramfs" "want_initram" -v 2>&1 || true
          }
          
          echo "=== RECOMPRESSING RAMDISK ==="
          gzip -c ramdisk.cpio > split_img/$(basename ../boot.img)-ramdisk.cpio.gz
          echo "Recompressed size: $(wc -c < split_img/$(basename ../boot.img)-ramdisk.cpio.gz)"
          
          echo "=== REPACKING BOOT IMAGE ==="
          ./repackimg_x64.sh
          mv image-new.img ../magisk_patched.img
          echo "=== SUCCESS ==="
      - name: Upload patched boot.img
        uses: actions/upload-artifact@v4
        with:
          name: magisk_patched.img
          path: magisk_patched.img
